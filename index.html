<body>
  <header>
    <h1>유학 준비 서비스</h1>
    <p>복잡한 유학 준비를 한 곳에서 관리하세요.</p>
  </header>

  <h2>서비스 소개</h2>
  <h3>복잡한 유학 준비를 더 간단하게</h3>

  <h2>주요 기능</h2>
  <ul>
    <li>
       <h3>01. 맞춤 준비 일정</h3>
       <p>목표 국가와 지원 시기에 맞춰 필요한 준비 일정을 확인할 수 있습니다.</p>
    </li>
    <li>
       <h3>02. 어학 시험 관리</h3>
       <p> IELTS, TOEFL 등 필요한 어학 시험과 목표 점수를 관리할 수 있습니다.</p>
    </li>
    <li>
       <h3>03. 지원 서류 체크리스트</h3>
       <p>자기소개서, 성적표, 어학 성적 등 지원에 필요한 서류를 체크리스트로 관리할 수 있습니다.</p>

  </ul>
